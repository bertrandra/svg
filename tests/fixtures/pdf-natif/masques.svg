<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120">
  <!-- Un masque de luminance en degrade sur deux formes qui se recouvrent, un masque alpha a deux opacites sur une forme et une image. -->
  <defs>
    <linearGradient id="clair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <mask id="lum" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect x="10" y="10" width="100" height="100" fill="url(#clair)"/></mask>
    <mask id="alpha" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="120" y="0" width="120" height="120"><circle cx="180" cy="60" r="45" fill="#000" fill-opacity="0.5"/><circle cx="180" cy="60" r="20" fill="#000"/></mask>
  </defs>
  <g mask="url(#lum)"><rect x="10" y="10" width="100" height="100" fill="#c81e28"/><circle cx="60" cy="60" r="30" fill="#1f4e8c"/></g>
  <g mask="url(#alpha)"><rect x="130" y="10" width="100" height="100" fill="#2a8a5a"/><image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAGCAIAAABxZ0isAAAAS0lEQVR42mPQqLgDRB/ACJnNqFFxloGB4QQDCFiASQib6QTDRyCyACNkNnOFTQADw885DD+BZAqYhLBZgJJYjWLQqJgIRB/ACJkNAMWlNtABJRMXAAAAAElFTkSuQmCC" x="150" y="30" width="60" height="60" preserveAspectRatio="none"/></g>
</svg>
