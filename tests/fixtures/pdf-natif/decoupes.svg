<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120">
  <!-- Des decoupes : un cercle qui rogne un fond et des traits, un anneau en evenodd, deux decoupes imbriquees, une decoupe de deux formes qui se recouvrent. -->
  <defs>
    <clipPath id="rond"><circle cx="50" cy="50" r="35"/></clipPath>
    <clipPath id="anneau" clip-rule="evenodd"><path d="M150 15a35 35 0 1 1 0 70a35 35 0 1 1 0-70zM150 35a15 15 0 1 1 0 30a15 15 0 1 1 0-30z" clip-rule="evenodd"/></clipPath>
    <clipPath id="bande"><rect x="0" y="40" width="240" height="20"/></clipPath>
    <clipPath id="deux"><circle cx="205" cy="45" r="18"/><circle cx="220" cy="60" r="18"/></clipPath>
  </defs>
  <g clip-path="url(#rond)">
    <rect x="10" y="10" width="80" height="45" fill="#e0b84a" stroke="#1f4e8c" stroke-width="8"/>
    <path d="M0 90L100 20" stroke="#c81e28" stroke-width="10"/>
  </g>
  <g clip-path="url(#anneau)"><rect x="110" y="10" width="80" height="80" fill="#2a8a5a"/></g>
  <g clip-path="url(#bande)"><g clip-path="url(#rond)"><rect x="0" y="0" width="120" height="120" fill="#7a3fb0" fill-opacity="0.6"/></g></g>
  <g clip-path="url(#deux)"><rect x="180" y="20" width="60" height="70" fill="#d05010"/></g>
  <rect x="5" y="100" width="230" height="12" fill="#404040"/>
</svg>
