<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160">
  <!-- Des motifs : un damier, un motif tourne en unites de boite, un trait en motif, une tuile a degrade, un motif dans un motif, une tuile a viewBox. -->
  <defs>
    <pattern id="damier" patternUnits="userSpaceOnUse" x="10" y="10" width="20" height="20"><rect width="10" height="10" fill="#c81e28"/><rect x="10" y="10" width="10" height="10" fill="#1f4e8c"/></pattern>
    <pattern id="raies" width="0.125" height="0.25" patternTransform="rotate(30)"><rect width="4" height="20" fill="#2a8a5a"/></pattern>
    <pattern id="points" patternUnits="userSpaceOnUse" width="6" height="6"><circle cx="3" cy="3" r="2" fill="#e0b84a"/></pattern>
    <linearGradient id="fondu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a00c0"/><stop offset="1" stop-color="#00b0c0"/></linearGradient>
    <pattern id="tuile" patternUnits="userSpaceOnUse" width="25" height="25"><rect x="2" y="2" width="21" height="21" fill="url(#fondu)"/></pattern>
    <pattern id="gigogne" patternUnits="userSpaceOnUse" width="30" height="30"><rect width="30" height="30" fill="#f4f0e8"/><rect x="5" y="5" width="20" height="20" fill="url(#points)"/></pattern>
    <pattern id="vue" patternUnits="userSpaceOnUse" width="16" height="16" viewBox="0 0 2 2"><path d="M0 0H1V1H0z" fill="#202020"/></pattern>
  </defs>
  <rect x="10" y="10" width="70" height="60" fill="url(#damier)"/>
  <rect x="90" y="10" width="60" height="60" fill="url(#raies)" stroke="#000" stroke-width="1"/>
  <circle cx="195" cy="40" r="28" fill="#fff8e0" stroke="url(#points)" stroke-width="8"/>
  <rect x="10" y="85" width="70" height="65" fill="url(#tuile)"/>
  <rect x="90" y="85" width="60" height="65" fill="url(#gigogne)"/>
  <ellipse cx="195" cy="117" rx="35" ry="30" fill="url(#vue)" fill-opacity="0.7"/>
</svg>
