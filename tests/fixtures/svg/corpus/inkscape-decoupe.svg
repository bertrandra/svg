<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Idiome reconstitue d'Inkscape 1.3 (sodipodi:namedview, calque inkscape:groupmode="layer", <clipPath clipPathUnits="userSpaceOnUse" id="clipPathNNNN"> dans <defs>, clip-path sur un groupe transforme, styles en ligne) ; formes originales. -->
<svg
   width="120mm"
   height="80mm"
   viewBox="0 0 120 80"
   version="1.1"
   id="svg1"
   inkscape:version="1.3.2 (091e20e, 2023-11-25)"
   sodipodi:docname="decoupe.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:document-units="mm" />
  <defs
     id="defs1">
    <clipPath
       clipPathUnits="userSpaceOnUse"
       id="clipPath1234">
      <path
         style="fill:#000000;stroke:none;stroke-width:0.264583"
         d="m 10,10 h 60 a 10,10 0 0 1 10,10 v 30 a 10,10 0 0 1 -10,10 H 10 Z"
         id="path1235"
         transform="translate(-5,-5)" />
    </clipPath>
  </defs>
  <g
     inkscape:label="Calque 1"
     inkscape:groupmode="layer"
     id="layer1">
    <g
       id="g7"
       clip-path="url(#clipPath1234)"
       transform="translate(20,15)">
      <circle
         style="fill:#c81e28;fill-opacity:1;stroke:none;stroke-width:0.5"
         id="path2"
         cx="20"
         cy="25"
         r="30" />
      <rect
         style="fill:#1f5fb0;fill-opacity:1;stroke:#15181d;stroke-width:1;stroke-linejoin:round"
         id="rect3"
         width="50"
         height="30"
         x="40"
         y="20" />
    </g>
  </g>
</svg>
