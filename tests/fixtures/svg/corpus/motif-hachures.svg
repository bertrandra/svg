<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Idiome reconstitue d'Inkscape 1.3 (motif « Stripes 1:1 » de la bibliotheque : un motif de base en unites du plan, un motif qui en
     herite par xlink:href et le pivote de 45 degres, inkscape:collect, inkscape:stockid, style des formes) ; formes originales. -->
<svg
   width="120mm"
   height="80mm"
   viewBox="0 0 120 80"
   version="1.1"
   id="svg1"
   inkscape:version="1.3 (0e150ed6c4, 2023-07-21)"
   sodipodi:docname="hachures.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:document-units="mm" />
  <defs
     id="defs1">
    <pattern
       inkscape:collect="always"
       patternUnits="userSpaceOnUse"
       width="2"
       height="1"
       patternTransform="translate(0,0) scale(2,2)"
       preserveAspectRatio="xMidYMid"
       id="Stripes1"
       inkscape:stockid="Stripes 1:1"
       inkscape:isstock="true">
      <rect
         style="fill:#1d3557;stroke:none"
         x="0"
         y="-0.5"
         width="1"
         height="2"
         id="rect1" />
    </pattern>
    <pattern
       inkscape:collect="always"
       xlink:href="#Stripes1"
       preserveAspectRatio="xMidYMid"
       id="pattern2"
       patternTransform="matrix(1.4142136,1.4142136,-1.4142136,1.4142136,10,5)"
       x="0"
       y="0" />
  </defs>
  <g
     inkscape:label="Calque 1"
     inkscape:groupmode="layer"
     id="layer1">
    <rect
       style="fill:url(#pattern2);fill-opacity:1;stroke:#1d3557;stroke-width:1.2;stroke-linejoin:round"
       id="rect3"
       width="70"
       height="50"
       x="8"
       y="12" />
    <ellipse
       style="fill:#f1faee;fill-opacity:1;stroke:url(#pattern2);stroke-width:4"
       id="path4"
       cx="96"
       cy="40"
       rx="16"
       ry="24" />
  </g>
</svg>
