<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 100">
  <!-- Un degrade et une image dans des groupes transformes : la matrice du groupe se compose dans la peinture et dans l'image, la
       feuille garde son groupe, l'opacite du groupe reste au groupe. -->
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2a8a"/>
      <stop offset="1" stop-color="#d7262d" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="soleil" gradientUnits="userSpaceOnUse" cx="20" cy="20" r="15">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#c81e28"/>
    </radialGradient>
  </defs>
  <g transform="translate(10 10) rotate(15)" opacity="0.8" data-name="Ciel">
    <rect width="60" height="30" fill="url(#horizon)"/>
    <g transform="scale(1.5)">
      <circle cx="20" cy="20" r="12" fill="url(#soleil)" stroke="url(#horizon)" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(90 20) rotate(-10 20 20)" data-name="Photo">
    <image xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAIAAAA7ljmRAAAAGUlEQVR42mMQ0VhwQk4DQjLAWSIaCxiQZQDf+wt9qZvCzAAAAABJRU5ErkJggg==" width="40" height="30" preserveAspectRatio="none"/>
    <path d="M0 35h40v10h-40z" fill="#1f5f3f"/>
  </g>
</svg>
