<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 140" width="300" height="140">
  <defs>
    <pattern id="base" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="8" height="8" fill="#ef476f"/>
      <rect x="8" y="8" width="8" height="8" fill="#118ab2"/>
    </pattern>
    <!-- Herite du contenu et des unites, change la taille de la tuile (le contenu ne change pas d'echelle). -->
    <pattern id="large" xlink:href="#base" width="24"/>
    <!-- Herite par une chaine de deux maillons, `href` l'emporte sur `xlink:href`, et pivote. -->
    <pattern id="tourne" href="#large" xlink:href="#rien" patternTransform="rotate(45 150 70)"/>
  </defs>
  <rect x="10" y="20" width="85" height="100" fill="url(#base)"/>
  <rect x="105" y="20" width="85" height="100" fill="url(#large)"/>
  <rect x="200" y="20" width="85" height="100" fill="url(#tourne)"/>
</svg>
