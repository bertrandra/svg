<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="220" height="130">
  <!-- Ombre puis flou du graphique fusionnes ; un groupe a ombre portee (avec son opacite), et une feuille floutee dedans -->
  <defs>
    <filter id="les-deux" filterUnits="userSpaceOnUse" x="0" y="0" width="220" height="130" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="a"/>
      <feOffset in="a" dx="3" dy="3" result="b"/>
      <feFlood flood-color="#000000" flood-opacity="0.35" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="d"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="e"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="e"/></feMerge>
    </filter>
    <filter id="ombre-groupe" filterUnits="userSpaceOnUse" x="100" y="10" width="115" height="115" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="4" stdDeviation="2" flood-color="#264653" flood-opacity="0.6"/>
    </filter>
    <filter id="leger" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs>
  <path d="M15 20C40 5 70 5 90 30C95 60 60 90 30 80C10 70 5 40 15 20Z" fill="#e9c46a" filter="url(#les-deux)"/>
  <g filter="url(#ombre-groupe)" opacity="0.9" id="Cartes">
    <rect x="110" y="20" width="45" height="60" fill="#ffffff" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="150" y="45" width="45" height="60" fill="#ffffff" stroke="#e76f51" stroke-width="2"/>
    <circle cx="172" cy="75" r="9" fill="#e76f51" filter="url(#leger)"/>
  </g>
</svg>
