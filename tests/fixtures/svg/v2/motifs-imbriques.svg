<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="300" height="140">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#90e0ef"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
    <pattern id="points" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff"/>
    </pattern>
    <!-- Une tuile qui emploie un degrade, un autre motif, un groupe a demi transparent et une feuille cachee. -->
    <pattern id="tuile" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="url(#ciel)"/>
      <g opacity="0.5" fill="#03045e">
        <rect x="4" y="4" width="14" height="14" fill="url(#points)"/>
        <circle cx="30" cy="30" r="7"/>
      </g>
      <rect x="22" y="2" width="10" height="10" fill="#d00000" display="none"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="280" height="120" fill="url(#tuile)"/>
</svg>
