<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <style>.voile { mask: url(#rayures); } #rayures { mask-type: luminance; }</style>
  <defs>
    <mask id="rayures" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="120">
      <rect x="0" y="0" width="200" height="20" fill="#fff"/>
      <rect x="0" y="40" width="200" height="20" fill="#fff"/>
      <rect x="0" y="80" width="200" height="20" fill="#fff"/>
    </mask>
  </defs>
  <g class="voile"><rect x="0" y="0" width="90" height="120" fill="#1f5fb0"/></g>
  <g class="voile"><rect x="110" y="0" width="90" height="120" fill="#c81e28"/></g>
</svg>
