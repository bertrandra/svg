<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <mask id="fenetres" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60">
      <g transform="translate(10 10)" fill="#fff">
        <rect x="0" y="0" width="30" height="40"/>
        <rect x="45" y="0" width="30" height="40" transform="scale(1 0.5)"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(20 20) scale(1.5)" mask="url(#fenetres)">
    <rect x="0" y="0" width="100" height="60" fill="#1f5f3f"/>
    <circle cx="50" cy="30" r="20" fill="#c81e28"/>
  </g>
</svg>
