<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140" width="300" height="140">
  <defs>
    <pattern id="tirets" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="5" height="10" fill="#fb8500"/>
      <rect x="5" width="5" height="10" fill="#023047"/>
    </pattern>
  </defs>
  <!-- Le meme motif au fond et au trait : une seule definition ecrite. -->
  <rect x="20" y="20" width="110" height="100" fill="url(#tirets)" stroke="url(#tirets)" stroke-width="8"/>
  <!-- Un trait a motif sur un fond uni, a demi transparent. -->
  <circle cx="220" cy="70" r="45" fill="#8ecae6" stroke="url(#tirets)" stroke-width="12" stroke-opacity="0.6"/>
</svg>
