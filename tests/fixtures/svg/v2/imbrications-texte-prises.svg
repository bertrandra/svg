<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <clipPath id="bande">
      <rect x="0" y="20" width="240" height="14"/>
    </clipPath>
    <clipPath id="moitie" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="0.5" height="1"/>
    </clipPath>
    <linearGradient id="fondu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="estompe">
      <rect x="0" y="0" width="240" height="160" fill="url(#fondu)"/>
    </mask>
    <filter id="ombre" x="0" y="0" width="240" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#15181d" flood-opacity="0.5"/>
    </filter>
  </defs>
  <text x="10" y="36" font-size="24" fill="#c81e28" clip-path="url(#bande)">Coupé</text>
  <text x="10" y="70" font-size="24" fill="#1f5fb0" clip-path="url(#moitie)">Moitié</text>
  <text x="10" y="110" font-size="24" fill="#15181d" mask="url(#estompe)">Estompé</text>
  <text x="10" y="150" font-size="24" fill="#f2b705" filter="url(#ombre)">Ombre</text>
</svg>
