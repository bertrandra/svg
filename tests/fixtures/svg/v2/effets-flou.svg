<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
  <!-- Flous gaussiens : isotrope (attribut), anisotrope, par style en ligne, par une classe, et un filtre partage par deux formes -->
  <style>.doux { filter: url(#flou-doux); }</style>
  <defs>
    <filter id="flou" x="-0.3" y="-0.3" width="1.6" height="1.6"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="flou-large" filterUnits="userSpaceOnUse" x="110" y="10" width="60" height="50" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="4 1.5"/></filter>
    <filter id="flou-doux" style="color-interpolation-filters:sRGB"><feGaussianBlur stdDeviation="1.25"/></filter>
  </defs>
  <rect x="10" y="10" width="60" height="40" fill="#c81e28" filter="url(#flou)"/>
  <ellipse cx="140" cy="35" rx="22" ry="14" fill="#1f5fb0" filter="url(#flou-large)"/>
  <circle cx="40" cy="90" r="18" fill="#2a9d8f" stroke="#264653" stroke-width="3" style="filter: url('#flou-doux')"/>
  <path class="doux" d="M110 75L150 75L130 110Z" fill="#f2b705"/>
  <path class="doux" d="M170 75L210 75L190 110Z" fill="#e76f51"/>
</svg>
