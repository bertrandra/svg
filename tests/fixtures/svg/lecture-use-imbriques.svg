<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#0a0a0a">
  <title>Clones imbriques et transformes</title>
  <defs>
    <path id="fleche" d="M0 0l10 5-10 5z"/>
    <g id="paire" stroke-width="1"><use href="#fleche"/><use href="#fleche" x="12" fill="#c81e28"/></g>
    <g id="cadre"><use href="#paire" transform="scale(2)"/><rect y="25" width="6" height="6" fill="currentColor"/></g>
  </defs>
  <use href="#cadre" x="10" y="10" transform="translate(5 0)" color="#2a5db0" fill="#d4a537" stroke="#15181d" stroke-width=".5"/>
  <use href="#paire" x="50" y="60" style="opacity:.5" stroke="#1f5f3f"/>
  <use href="#fleche" x="20" y="-40" transform="rotate(90) scale(1.5)" fill="#7b2d8e"/>
</svg>
