<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur SVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Les jetons de l'interface : un chrome neutre et froid, une seule couleur d'outil. Le dessin
   edite garde ses propres couleurs. */
:root {
  --table: #e9ecef;
  --panneau: #f7f8f9;
  --encre: #15181d;
  --encre-douce: #555c66;
  --filet: #cfd4da;
  --cyan: #00719c;
  --sur-cyan: #ffffff;
  --ok: #24724a; --ok-fond: #dff0e6;
  --alerte: #8a5a00; --alerte-fond: #f8ecd2;
  --echec: #a8322a; --echec-fond: #f7e0dd;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #121518; --panneau: #1a1e22; --encre: #e6e9ec; --encre-douce: #9aa3ad; --filet: #2f353c;
    --cyan: #4fb3dc; --sur-cyan: #08202b;
    --ok: #7fcfa0; --ok-fond: #183326; --alerte: #e3b45a; --alerte-fond: #33280f; --echec: #f08b80; --echec-fond: #3a1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #121518; --panneau: #1a1e22; --encre: #e6e9ec; --encre-douce: #9aa3ad; --filet: #2f353c;
  --cyan: #4fb3dc; --sur-cyan: #08202b;
  --ok: #7fcfa0; --ok-fond: #183326; --alerte: #e3b45a; --alerte-fond: #33280f; --echec: #f08b80; --echec-fond: #3a1c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--encre); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button { font: inherit; font-size: 0.85rem; font-weight: 600; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--cyan); background: var(--cyan); color: var(--sur-cyan); cursor: pointer; }
button.discret { background: transparent; color: var(--cyan); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
input[type="text"], select, textarea { font: inherit; font-size: 0.85rem; width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--filet); border-radius: 5px; background: var(--table); color: var(--encre); }
textarea { font-family: var(--mono); font-size: 0.78rem; resize: vertical; }
input[type="color"] { width: 38px; height: 32px; padding: 0; border: 1px solid var(--filet); border-radius: 5px; background: none; flex: none; }
.aide { font-size: 0.7rem; color: var(--encre-douce); }
.mini-onglets { display: flex; gap: 2px; background: var(--table); border-radius: 6px; padding: 2px; }
.mini-onglets button { flex: 1; background: transparent; color: var(--encre-douce); border: 0; padding: 5px 6px; font-size: 0.78rem; white-space: nowrap; }
.mini-onglets button[aria-pressed="true"] { background: var(--cyan); color: var(--sur-cyan); }

/* La page d'accueil : ouvrir un SVG, puis le resultat. */
.accueil { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
.tete h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.tete p { margin: 0; color: var(--encre-douce); max-width: 70ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.depot { border: 2px dashed var(--filet); border-radius: 10px; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--panneau); transition: border-color 0.15s, background 0.15s; }
.depot p { margin: 0; color: var(--encre-douce); }
.depot.survol { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, var(--panneau)); }
.colonnes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.champ { display: grid; gap: 6px; min-width: 0; align-content: start; }
.champ > span { font-size: 0.82rem; font-weight: 600; }
.champ > button { justify-self: start; }
.message { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--alerte-fond); color: var(--alerte); font-size: 0.85rem; }
.resultat { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); padding: 16px; }
.apercu { width: 100%; max-height: 320px; object-fit: contain; border: 1px solid var(--filet); border-radius: 6px; padding: 10px; background-color: #ffffff; background-image: linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%), linear-gradient(45deg, #e6e6e6 25%, transparent 25%, transparent 75%, #e6e6e6 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.fiche { display: grid; gap: 8px; align-content: start; }
.fiche h2 { font-size: 1rem; margin: 0; font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 640px) { .resultat { grid-template-columns: minmax(0, 1fr); } }
section h2 { font-size: 1.05rem; margin: 0 0 8px; }
.ouvrir, .vectoriser, .bibliotheque, .nuancier-page { display: grid; gap: 10px; border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); padding: 16px; }
.depot.petit { padding: 16px; }
.case { display: flex; gap: 6px; align-items: center; font-size: 0.82rem; }
.reglages-image { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.reglages-image .actions { grid-column: 1 / -1; align-items: center; }
.resultat-image { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; border-top: 1px dashed var(--filet); padding-top: 12px; }
@media (max-width: 640px) { .resultat-image { grid-template-columns: minmax(0, 1fr); } }
.pied p { margin: 0; }
.pied a { color: var(--cyan); }
/* La bibliotheque : une grille de vignettes, dans la page et dans l'editeur. */
.recherche-formes { display: grid; gap: 8px; }
.recherche-formes .filtres { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.recherche-formes.compact .filtres { grid-template-columns: minmax(0, 1fr); }
.recherche-formes input[type="search"] { font: inherit; font-size: 0.85rem; width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--filet); border-radius: 5px; background: var(--table); color: var(--encre); }
.recherche-formes > button { justify-self: start; }
.grille-formes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.recherche-formes.compact .grille-formes { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.vignette { width: 100%; display: grid; justify-items: center; gap: 4px; padding: 6px 4px; background: var(--table); color: var(--encre); border: 1px solid var(--filet); border-radius: 6px; font-weight: 400; font-size: 0.68rem; line-height: 1.2; text-align: center; }
.vignette:hover { border-color: var(--cyan); }
.vignette img { width: 64px; height: 64px; background: #ffffff; border-radius: 4px; padding: 4px; }
.recherche-formes.compact .vignette img { width: 44px; height: 44px; }
.recherche-formes.compact .vignette span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.bibliotheque-editeur summary { font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--encre-douce); }
.bibliotheque-editeur[open] summary { margin-bottom: 6px; }

/* L'editeur SVG plein ecran. Il se pose par-dessus la page, en portail. */
.editeur-svg { position: fixed; inset: 0; z-index: 1000; background: var(--table); color: var(--encre); }
.editeur-cadre { display: grid; height: 100%; grid-template-columns: 220px minmax(0, 1fr) 300px; grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: "barre barre barre" "selection selection selection" "confirmer confirmer confirmer" "calques toile inspecteur" "etat etat etat"; }
.editeur-barre { grid-area: barre; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; padding: 4px 10px; border-bottom: 1px solid var(--filet); background: var(--panneau); }
.editeur-barre .groupe, .editeur-barre-selection .groupe { display: flex; align-items: center; gap: 1px; padding: 0 6px; border-right: 1px solid var(--filet); }
.editeur-barre .groupe.fin, .editeur-barre-selection .groupe:last-child { border-right: 0; }
.editeur-titre { font-size: 0.82rem; padding-right: 10px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editeur-barre .espace, .editeur-etat .espace { flex: 1; }
/* Les boutons d'outil : carres, neutres, l'etat actif en couleur d'outil. */
.icone-bouton { width: 30px; height: 30px; padding: 0; display: inline-grid; place-items: center; background: transparent; color: var(--encre); border: 1px solid transparent; border-radius: 6px; }
.icone-bouton:hover:not(:disabled) { background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.icone-bouton[aria-pressed="true"] { background: var(--cyan); color: var(--sur-cyan); }
.icone-bouton:disabled { opacity: 0.35; cursor: not-allowed; }
.icone-bouton.danger { color: var(--echec); }
.icone-bouton.danger:hover:not(:disabled) { background: var(--echec-fond); }
.icone { display: block; }
.editeur-barre .zoom { height: 30px; min-width: 52px; padding: 0 4px; font-family: var(--mono); font-size: 0.75rem; font-weight: 500; background: transparent; color: var(--encre); border: 1px solid transparent; border-radius: 6px; }
.editeur-barre .zoom:hover { background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.editeur-barre button.texte { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; font-size: 0.78rem; margin-left: 4px; }
.editeur-barre button.texte:disabled { opacity: 0.45; cursor: not-allowed; }
.style-courant { gap: 6px; }
.pastille-style { position: relative; display: inline-flex; align-items: center; }
.pastille-style input[type="color"] { width: 30px; height: 30px; padding: 2px; border: 1px solid var(--filet); border-radius: 6px; background: transparent; cursor: pointer; }
.pastille-style button.aucun { position: absolute; right: -4px; top: -4px; width: 16px; height: 16px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--panneau); color: var(--encre-douce); border: 1px solid var(--filet); }
.pastille-style button.aucun.actif { background: var(--echec); color: var(--panneau); border-color: var(--echec); }
.pastille-style button.aucun:hover { color: var(--echec); border-color: var(--echec); }
.editeur-inspecteur button:disabled { opacity: 0.45; cursor: not-allowed; }
/* La rangee de la selection, sous la barre : aligner, transformer, empiler, combiner, separer. */
.editeur-barre-selection { grid-area: selection; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; padding: 2px 10px; border-bottom: 1px solid var(--filet); background: color-mix(in srgb, var(--cyan) 6%, var(--panneau)); }
.editeur-barre-selection > .aide { min-width: 96px; padding-right: 6px; }
.editeur-barre-selection .icone-bouton { width: 28px; height: 28px; }
.editeur-svg-toile .grille { stroke: color-mix(in srgb, var(--cyan) 35%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.editeur-confirmer { grid-area: confirmer; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--alerte-fond); color: var(--alerte); font-size: 0.82rem; }
.editeur-calques { grid-area: calques; overflow: auto; border-right: 1px solid var(--filet); background: var(--panneau); padding: 8px; }
.editeur-calques h3, .editeur-inspecteur h3 { font-size: 0.8rem; margin: 2px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.calques-actions { display: flex; gap: 4px; margin-bottom: 6px; }
.calques-actions button { padding: 2px 8px; font-size: 0.72rem; }
.editeur-calques ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.editeur-calques li { display: flex; align-items: center; gap: 2px; border-radius: 4px; content-visibility: auto; contain-intrinsic-size: auto 26px; }
.editeur-calques li.choisi { background: color-mix(in srgb, var(--cyan) 18%, transparent); }
.editeur-calques .calque-nom { flex: 1; display: flex; align-items: center; gap: 6px; background: transparent; color: var(--encre); border: 0; padding: 3px 4px; font-weight: 400; font-size: 0.75rem; text-align: left; }
.editeur-calques .calque-bascule { background: transparent; border: 0; color: var(--encre-douce); padding: 2px 4px; font-size: 0.75rem; }
.editeur-calques .echantillon { width: 14px; height: 14px; border-radius: 3px; }
.editeur-toile { grid-area: toile; position: relative; overflow: hidden; background: var(--table); }
.editeur-svg-toile { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
.outil-main .editeur-svg-toile { cursor: grab; }
.outil-points .editeur-svg-toile { cursor: crosshair; }
.editeur-svg-toile .plan-travail { stroke: var(--filet); stroke-width: 1; vector-effect: non-scaling-stroke; }
.trace-contour { stroke: var(--cyan); stroke-width: 1; vector-effect: non-scaling-stroke; }
.trace-choisi { fill: none; stroke: var(--cyan); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.boite-choisie { fill: none; stroke: var(--cyan); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.editeur-svg-toile .coin { fill: var(--panneau); stroke: var(--cyan); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.coin-nw, .coin-se { cursor: nwse-resize; }
.coin-ne, .coin-sw { cursor: nesw-resize; }
.editeur-svg-toile .ancre { fill: var(--panneau); stroke: var(--cyan); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: move; }
.editeur-svg-toile .ancre-choisie { fill: var(--cyan); }
.editeur-svg-toile .poignee { fill: var(--cyan); stroke: var(--panneau); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: move; }
.lien-poignee { stroke: var(--cyan); stroke-width: 1; vector-effect: non-scaling-stroke; }
.trace-en-cours { fill: none; stroke: var(--cyan); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.outil-rectangle .editeur-svg-toile, .outil-ellipse .editeur-svg-toile, .outil-etoile .editeur-svg-toile, .outil-ligne .editeur-svg-toile, .outil-plume .editeur-svg-toile { cursor: crosshair; }
.cadre-selection { fill: color-mix(in srgb, var(--cyan) 10%, transparent); stroke: var(--cyan); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.editeur-toile.fond-blanc .plan-travail { fill: #ffffff; }
.editeur-toile.fond-sombre .plan-travail { fill: #1b1d20; }
.editeur-toile .damier-a { fill: #ffffff; }
.editeur-toile .damier-b { fill: #e6e6e6; }
.editeur-inspecteur { grid-area: inspecteur; overflow: auto; border-left: 1px solid var(--filet); background: var(--panneau); padding: 8px 12px; display: grid; gap: 10px; align-content: start; }
.editeur-groupe { border: 1px solid var(--filet); border-radius: 6px; padding: 6px 8px; margin: 0; display: grid; gap: 6px; min-width: 0; }
.editeur-groupe legend { font-size: 0.72rem; font-weight: 600; padding: 0 4px; color: var(--encre-douce); }
.editeur-inspecteur .boutons { display: flex; flex-wrap: wrap; gap: 4px; }
.editeur-inspecteur .boutons button { padding: 4px 8px; font-size: 0.75rem; }
.editeur-svg button.danger { background: var(--echec); border-color: var(--echec); color: var(--panneau); }
.champ-ligne { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; min-width: 0; }
.champ-ligne > span:first-child { min-width: 62px; color: var(--encre-douce); }
.champ-ligne input[type="text"] { width: 84px; font-family: var(--mono); font-size: 0.75rem; padding: 3px 5px; }
.champ-ligne input[type="color"], .couleurs-dessin input[type="color"] { width: 32px; height: 26px; padding: 0; border: 1px solid var(--filet); border-radius: 4px; background: transparent; flex: none; }
.champ-ligne input[type="range"] { flex: 1; min-width: 0; }
.champ-ligne button { padding: 3px 8px; font-size: 0.72rem; }
.grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.grille-2 .champ-ligne > span:first-child { min-width: 14px; }
.grille-2 .champ-ligne input { width: 100%; min-width: 0; }
.nuancier { display: flex; flex-wrap: wrap; gap: 4px; }
.nuancier .echantillon { width: 22px; height: 22px; padding: 0; border: 1px solid var(--filet); cursor: pointer; }
.nuancier .echantillon[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--cyan); }
.couleurs-dessin { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.couleurs-dessin li { display: flex; gap: 6px; align-items: center; min-width: 0; }
.couleurs-dessin button { font-family: var(--mono); font-size: 0.72rem; padding: 3px 6px; }
.couleurs-dessin select { font-size: 0.72rem; max-width: 120px; min-width: 0; }
.editeur-etat { grid-area: etat; display: flex; gap: 8px; padding: 6px 12px; font-size: 0.75rem; color: var(--encre-douce); border-top: 1px solid var(--filet); background: var(--panneau); }
.editeur-erreur { max-width: 520px; margin: 15vh auto; display: grid; gap: 12px; padding: 16px; justify-items: start; }
.editeur-aide summary { font-size: 0.75rem; cursor: pointer; }
.editeur-aide ul { margin: 6px 0 0; padding-left: 16px; font-size: 0.72rem; color: var(--encre-douce); display: grid; gap: 2px; }
/* Guides, poignee de rotation, menus et panneaux nouveaux. */
.editeur-svg-toile .guide { stroke: var(--echec); stroke-width: 1; stroke-dasharray: 4 2; vector-effect: non-scaling-stroke; }
.editeur-svg-toile .poignee-rotation { fill: var(--panneau); stroke: var(--cyan); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: grab; }
.menu-export { position: relative; }
.menu-export > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.menu-export > summary::-webkit-details-marker { display: none; }
.menu-export:not(.compact) > summary { font: inherit; font-size: 0.85rem; font-weight: 600; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--cyan); color: var(--cyan); }
.menu-export .contenu-export { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 280px; display: grid; gap: 6px; padding: 10px; background: var(--panneau); border: 1px solid var(--filet); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
.menu-export .contenu-export button { font-size: 0.78rem; padding: 5px 9px; justify-self: start; }
.menu-export .ligne-export { display: flex; align-items: center; gap: 6px; }
.menu-export .ligne-export select { width: auto; font-size: 0.75rem; }
.menu-export .ligne-export input[type="color"] { width: 26px; height: 24px; }
.resultat .menu-export .contenu-export { left: 0; right: auto; }
.transformations-numeriques { display: grid; gap: 6px; margin-top: 4px; }
.transformations-numeriques > button { justify-self: start; }
.versions { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.versions li { display: flex; gap: 4px; align-items: center; font-size: 0.75rem; }
.versions .nom-version { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.versions button { padding: 2px 6px; font-size: 0.7rem; }
.panier { display: grid; gap: 6px; padding: 6px; border: 1px dashed var(--cyan); border-radius: 6px; }
.grille-formes li { position: relative; }
.grille-formes .plus { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; background: var(--panneau); border-color: var(--filet); opacity: 0; }
.grille-formes li:hover .plus, .grille-formes li:focus-within .plus, .grille-formes li.en-edition .plus { opacity: 1; }
.grille-formes .plus + .plus { right: 26px; }
.correcteur { grid-column: 1 / -1; display: grid; gap: 8px; padding: 10px; background: var(--table); border: 1px solid var(--cyan); border-radius: 8px; }
.grille-formes li.en-edition { grid-column: 1 / -1; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.cases-evenements { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.75rem; max-height: 140px; overflow: auto; }
.champ-ligne.scene select { flex: 1; }
.reprise { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border: 1px solid var(--cyan); border-radius: 10px; background: color-mix(in srgb, var(--cyan) 8%, var(--panneau)); }
.reprise p { margin: 0; }
.editeur-etat .tiroirs { display: none; gap: 2px; }
.editeur-etat .message-etat { min-width: 0; }
.editeur-inspecteur textarea { font: inherit; font-size: 0.82rem; }
