<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur SVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Les jetons de couleur de l'interface viennent de src/styles/jetons.ts (ADR-0007) : le CSS des
   variables est genere au build, ici, et la page n'ecrit aucune couleur a la main. */
/*JETONS*/
/*STYLE_BASE*/

/* La page d'accueil : ouvrir un SVG, puis le resultat. */
.accueil { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
.tete h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
.tete p { margin: 0; color: var(--encre-douce); max-width: 70ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.depot { border: 2px dashed var(--filet); border-radius: 10px; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--panneau); transition: border-color 0.15s, background 0.15s; }
.depot p { margin: 0; color: var(--encre-douce); }
.depot.survol { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, var(--panneau)); }
@supports not (color: color-mix(in srgb, currentcolor, currentcolor)) { .depot.survol { background: var(--repli-cyan-8-panneau); } }
.colonnes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.champ { display: grid; gap: 6px; min-width: 0; align-content: start; }
.champ > span { font-size: 0.82rem; font-weight: 600; }
.champ > button { justify-self: start; }
.resultat { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); padding: 16px; }
.apercu { width: 100%; max-height: 320px; object-fit: contain; border: 1px solid var(--filet); border-radius: 6px; padding: 10px; background-color: var(--damier-a); background-image: linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%), linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.fiche { display: grid; gap: 8px; align-content: start; }
.fiche h2 { font-size: 1rem; margin: 0; font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 640px) { .resultat { grid-template-columns: minmax(0, 1fr); } }
section h2 { font-size: 1.05rem; margin: 0 0 8px; }
.ouvrir, .vectoriser { display: grid; gap: 10px; }
.nuancier-page { border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); padding: 0 16px; }
.nuancier-page > summary { display: flex; gap: 8px; align-items: baseline; padding: 12px 0; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
.nuancier-page[open] > summary { border-bottom: 1px solid var(--filet); margin-bottom: 12px; }
.nuancier-page > .champ { padding-bottom: 16px; }
/* Trois voies pour commencer, cote a cote ; celle du moment ouvre son panneau dessous. */
.voies { display: grid; gap: 12px; }
.voies-choix { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.voie { display: grid; justify-items: start; align-content: start; gap: 4px; padding: 16px; text-align: left; border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); color: var(--encre); font-weight: 400; }
.voie .icone { color: var(--cyan); margin-bottom: 4px; }
.voie-titre { font-weight: 600; font-size: 0.95rem; }
.voie-aide { font-size: 0.75rem; color: var(--encre-douce); }
.voie[aria-selected="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); background: color-mix(in srgb, var(--cyan) 7%, var(--panneau)); color: var(--encre); }
@supports not (color: color-mix(in srgb, currentcolor, currentcolor)) { .voie[aria-selected="true"] { background: var(--repli-cyan-7-panneau); } }
@media (forced-colors: active) { .voie[aria-selected="true"] { outline: 3px solid Highlight; outline-offset: -3px; } .depot.survol { border-color: Highlight; } .voie:hover { border-color: Highlight; } }
.voie-panneau { border: 1px solid var(--filet); border-radius: 10px; background: var(--panneau); padding: 16px; animation: apparition 0.18s ease-out; }
.voie-panneau .depot { background: var(--table); }
@media (max-width: 640px) {
  .voies-choix { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .voie { grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; padding: 12px 16px; }
  .voie .icone { grid-row: 1 / 3; align-self: center; margin: 0; }
}
.depot.petit { padding: 16px; }
.reglages-image { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.reglages-image .actions { grid-column: 1 / -1; align-items: center; }
/* L'atelier du resultat : la visionneuse a gauche, les reglages du trace a droite, les essais dessous. */
.depot .miniature { max-width: 160px; max-height: 120px; object-fit: contain; border: 1px solid var(--filet); border-radius: 6px; padding: 4px; background-color: var(--damier-a); background-image: linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%), linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%); background-size: 12px 12px; background-position: 0 0, 6px 6px; }
.atelier-vecto { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; border-top: 1px dashed var(--filet); padding-top: 12px; }
.atelier-vecto[aria-busy="true"] .visionneuse { opacity: 0.7; }
.colonne-resultat { display: grid; gap: 8px; min-width: 0; }
.barre-visionneuse { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.barre-visionneuse select { width: auto; font-size: 0.78rem; }
.barre-visionneuse .groupe { display: flex; gap: 1px; }
.visionneuse { display: flex; max-height: 520px; overflow: auto; border: 1px solid var(--filet); border-radius: 8px; padding: 8px; background-color: var(--toile-blanc); transition: opacity 0.15s; }
.visionneuse.fond-damier { background-image: linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%), linear-gradient(45deg, var(--damier-b) 25%, transparent 25%, transparent 75%, var(--damier-b) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.visionneuse.fond-sombre { background: var(--toile-sombre); }
.visionneuse .plan { position: relative; margin: auto; line-height: 0; }
.visionneuse .calque { display: block; }
.visionneuse .calque.base { image-rendering: auto; }
.visionneuse .calque.cache { opacity: 0; }
.visionneuse .calque.haut { position: absolute; inset: 0; width: 100%; height: 100%; }
.visionneuse .ligne-rideau { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--cyan); box-shadow: 0 0 0 1px var(--panneau); pointer-events: none; }
.rideau { display: flex; align-items: center; gap: 8px; }
.rideau input[type="range"] { flex: 1; min-width: 0; }
.rideau select { width: auto; flex: 0 0 auto; font-size: 0.78rem; }
.fiche-resultat { display: grid; gap: 6px; }
.fiche-resultat p { margin: 0; }
.essais h3 { font-size: 0.8rem; margin: 4px 0 6px; display: flex; gap: 8px; align-items: baseline; }
.essais ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.essais li button { display: grid; gap: 2px; justify-items: center; width: 118px; padding: 6px 4px; background: var(--table); color: var(--encre); border: 1px solid var(--filet); border-radius: 6px; font-weight: 400; font-size: 0.68rem; line-height: 1.25; text-align: center; }
.essais li button[aria-pressed="true"] { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.essais li button img { width: 64px; height: 64px; object-fit: contain; background: var(--toile-blanc); border-radius: 4px; padding: 2px; }
.reglages-vecto { display: grid; gap: 10px; min-width: 0; }
.reglages-fins .fin { display: grid; grid-template-columns: 112px minmax(0, 1fr) 36px 22px; align-items: center; gap: 6px; font-size: 0.78rem; }
.reglages-fins .fin-libelle { color: var(--encre-douce); }
.reglages-fins .fin.touche .fin-libelle, .reglages-fins .champ-ligne.touche > span:first-child { color: var(--cyan); font-weight: 600; }
.reglages-fins .fin.touche .fin-libelle::before, .reglages-fins .champ-ligne.touche > span:first-child::before { content: "● "; }
.reglages-fins output { font-family: var(--mono); font-size: 0.72rem; text-align: right; }
.icone-bouton.petit { width: 22px; height: 22px; }
.reglages-pretraitement { display: grid; gap: 8px; }
.reglages-pretraitement .fin { display: grid; grid-template-columns: 112px minmax(0, 1fr) 36px 22px; align-items: center; gap: 6px; font-size: 0.78rem; }
.reglages-pretraitement .fin-libelle { color: var(--encre-douce); }
.reglages-pretraitement .fin.touche .fin-libelle { color: var(--cyan); font-weight: 600; }
.reglages-pretraitement .fin.touche .fin-libelle::before { content: "● "; }
.reglages-pretraitement output { font-family: var(--mono); font-size: 0.72rem; text-align: right; }
.reglages-pretraitement .mini-onglets { flex-wrap: wrap; }
.bilan-pretraitement { display: grid; gap: 4px; }
.bilan-pretraitement p { margin: 0; }
.essais .pre-essai { overflow-wrap: anywhere; }
.lot { display: grid; gap: 8px; border-top: 1px dashed var(--filet); padding-top: 12px; }
.lot h3 { font-size: 0.9rem; margin: 0; display: flex; gap: 8px; align-items: baseline; }
.lot progress { width: 100%; accent-color: var(--cyan); }
.lot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lot li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 4px 0; border-bottom: 1px solid var(--filet); font-size: 0.8rem; }
.lot .lot-nom { font-weight: 600; overflow-wrap: anywhere; flex: 1 1 140px; }
.lot .lot-etat { color: var(--encre-douce); flex: 2 1 160px; }
.reglages-fins .champ-ligne select { flex: 1; min-width: 0; font-size: 0.75rem; }
@media (max-width: 900px) { .atelier-vecto { grid-template-columns: minmax(0, 1fr); } }
.resultat-image { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; border-top: 1px dashed var(--filet); padding-top: 12px; }
@media (max-width: 640px) { .resultat-image { grid-template-columns: minmax(0, 1fr); } }
.pied p { margin: 0; }
.pied a { color: var(--cyan); }
/*STYLE_EDITEUR*/
</style>

<!-- Ce que lit un navigateur qui n'execute pas le moteur (JavaScript coupe, syntaxe trop recente pour lui) : React remplace ce
     paragraphe au demarrage, il ne reste a l'ecran que si rien ne tourne. -->
<div id="editeur"><main class="accueil"><p class="message">Chargement de l’éditeur… Si ce message reste affiché, JavaScript est désactivé ou ce navigateur est trop ancien :
  utilisez une version récente de Chrome, Edge, Firefox ou Safari (iOS 16.4 et plus).</p></main></div>
<script>/*MOTEUR*/</script>
